<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07151d" />

  <title>Nuova password</title>

  <style>
    :root {
      --gold: #e7b654;
      --gold-light: #ffe19a;
      --text: #f4f7f9;
      --muted: #9eb0b8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 50% 20%, #163d4e 0%, #07151d 52%, #03090d 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .card {
      width: min(440px, 100%);
      padding: 26px;
      border: 1px solid rgba(231,182,84,.6);
      border-radius: 20px;
      background: rgba(5,22,30,.96);
      box-shadow: 0 25px 70px rgba(0,0,0,.55);
    }

    h1 {
      margin: 0 0 8px;
      color: var(--gold-light);
      text-align: center;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      text-align: center;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(255,225,150,.27);
      border-radius: 10px;
      outline: none;
      background: rgba(0,0,0,.28);
      color: white;
    }

    input:focus {
      border-color: rgba(255,225,150,.7);
    }

    #saveBtn {
      padding: 12px 14px;
      border: 1px solid #f0cb75;
      border-radius: 10px;
      background: linear-gradient(#d99a32, #874311);
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    #saveBtn:disabled {
      opacity: .5;
      cursor: default;
    }

    #status {
      min-height: 1.5em;
      color: #ffd083;
      text-align: center;
      font-size: 14px;
    }

    .back {
      display: block;
      width: fit-content;
      margin: 16px auto 0;
      color: var(--gold-light);
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>Nuova password</h1>

    <p id="intro">
      Inserisci la nuova password per il tuo account.
    </p>

    <div id="resetForm" class="form">
      <input
        id="passwordInput"
        type="password"
        autocomplete="new-password"
        placeholder="Nuova password"
      />

      <input
        id="passwordConfirmInput"
        type="password"
        autocomplete="new-password"
        placeholder="Ripeti nuova password"
      />

      <button id="saveBtn" type="button" disabled>
        Salva nuova password
      </button>

      <div id="status">
        Verifica del link di recupero...
      </div>
    </div>

    <a class="back" href="./index.html">
      Torna alla home
    </a>

  </main>


  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const SUPABASE_URL =
      'https://jhpppwqdaceratwjnbzi.supabase.co';


    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpocHBwd3FkYWNlcmF0d2puYnppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNzcwOTIsImV4cCI6MjA4MDk1MzA5Mn0.0SL_piY3zI04UTogAPJxl5nlzmm3AFD5pTGPFKaqEyE';


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );


    const passwordInput =
      document.querySelector(
        "#passwordInput"
      );


    const passwordConfirmInput =
      document.querySelector(
        "#passwordConfirmInput"
      );


    const saveBtn =
      document.querySelector(
        "#saveBtn"
      );


    const statusEl =
      document.querySelector(
        "#status"
      );


    let recoveryReady =
      false;


    function setReady(
      ready
    ) {

      recoveryReady =
        ready;


      saveBtn.disabled =
        !ready;


      if (ready) {

        statusEl.textContent =
          "Link valido. Puoi scegliere la nuova password.";
      }
    }


    async function checkSession() {

      const {
        data,
        error
      } =
        await supabase.auth
          .getSession();


      if (error) {

        statusEl.textContent =
          error.message;

        return;
      }


      if (
        data.session
      ) {

        setReady(
          true
        );

      } else {

        statusEl.textContent =
          "Link di recupero non valido o scaduto.";
      }
    }


    supabase.auth
      .onAuthStateChange(
        (
          event,
          session
        ) => {

          if (
            event === "PASSWORD_RECOVERY"
            ||
            (
              event === "SIGNED_IN"
              &&
              session
            )
          ) {

            setReady(
              true
            );
          }
        }
      );


    saveBtn.addEventListener(
      "click",
      async () => {

        if (
          !recoveryReady
        ) {

          return;
        }


        const password =
          passwordInput.value;


        const confirmation =
          passwordConfirmInput.value;


        if (!password) {

          statusEl.textContent =
            "Inserisci la nuova password.";

          return;
        }


        if (
          password !== confirmation
        ) {

          statusEl.textContent =
            "Le due password non coincidono.";

          return;
        }


        saveBtn.disabled =
          true;


        statusEl.textContent =
          "Aggiornamento password...";


        const {
          error
        } =
          await supabase.auth
            .updateUser(
              {
                password
              }
            );


        if (error) {

          statusEl.textContent =
            error.message;

          saveBtn.disabled =
            false;

          return;
        }


        statusEl.textContent =
          "Password aggiornata. Ritorno alla home...";


        setTimeout(
          () => {

            window.location.href =
              "./index.html";
          },
          1400
        );
      }
    );


    await checkSession();

  </script>

</body>
</html>
