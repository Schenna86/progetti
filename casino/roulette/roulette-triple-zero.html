/* ============================================================
   MOBILE ROULETTE
   ============================================================ */

@media (max-width: 680px) {

  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  #app {
    padding:
      max(4px, env(safe-area-inset-top))
      max(4px, env(safe-area-inset-right))
      max(6px, env(safe-area-inset-bottom))
      max(4px, env(safe-area-inset-left));
  }

  .shell {
    width: 100%;
    max-width: 100%;
  }


  /* ---------------- HEADER ---------------- */

  header {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 5px 7px;
    align-items: center;
    margin-bottom: 6px;
  }

  .brand {
    min-width: 0;
  }

  .brand h1 {
    font-size: 20px;
    line-height: 1.05;
  }

  .brand p {
    display: none;
  }

  .header-actions {
    justify-content: flex-end;
    gap: 4px;
  }

  .pill,
  .header-btn {
    min-height: 32px;
    padding: 5px 8px;
    font-size: 11px;
  }

  .header-actions .pill:first-child {
    display: none;
  }

  .top-progress {
    grid-column: 1 / -1;
    grid-row: auto;
    min-width: 0;
  }

  .xp-header {
    margin-bottom: 2px;
    font-size: 9px;
  }

  .xp-level strong {
    font-size: 11px;
  }

  .xp-bar {
    height: 10px;
  }


  /* ---------------- LAYOUT ---------------- */

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 7px;
  }

  .panel {
    width: 100%;
    max-width: 100%;
    border-radius: 11px;
  }

  .panel-head {
    min-height: 0;
    padding: 7px 9px;
  }

  .panel-head h2 {
    font-size: 14px;
  }

  .panel-head small {
    font-size: 9px;
  }


  /* ---------------- RUOTA COMPATTA ---------------- */

  .wheel-section {
    display: grid;
    grid-template-columns: 112px minmax(0, 1fr);
    gap: 7px;
    align-items: center;
    padding: 7px;
  }

  .wheel-wrap {
    width: 108px;
    max-width: 108px;
    margin: 0 auto;
    filter: drop-shadow(0 7px 8px rgba(0,0,0,.45));
  }

  .wheel-pointer {
    top: -1px;
    border-left-width: 6px;
    border-right-width: 6px;
    border-top-width: 12px;
  }

  .result-display {
    min-width: 0;
    margin: 0;
    grid-template-columns: 42px minmax(0,1fr);
    gap: 7px;
    padding: 7px;
    border-radius: 9px;
  }

  .result-ball {
    width: 42px;
    height: 42px;
    border-width: 2px;
    font-size: 19px;
  }

  .result-info {
    min-width: 0;
  }

  .result-info strong {
    overflow: hidden;
    font-size: 13px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .result-info span {
    display: block;
    margin-top: 2px;
    font-size: 9px;
    line-height: 1.2;
  }

  .history {
    grid-column: 1 / -1;
    margin-top: 0;
    padding-bottom: 1px;
    flex-wrap: nowrap;
    gap: 3px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }

  .history::-webkit-scrollbar {
    display: none;
  }

  .history-number {
    flex: 0 0 auto;
    min-width: 23px;
    height: 23px;
    padding: 0 3px;
    border-radius: 5px;
    font-size: 9px;
  }

  .bet-summary {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    margin-top: 0;
    padding: 5px;
    border-radius: 8px;
  }

  .summary-row {
    display: flex;
    min-width: 0;
    margin: 0;
    padding: 2px;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    text-align: center;
  }

  .summary-row span {
    font-size: 8px;
    line-height: 1.1;
  }

  .summary-row strong {
    max-width: 100%;
    overflow: hidden;
    font-size: 11px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }


  /* ---------------- TAVOLO ---------------- */

  .table-scroll {
    width: 100%;
    max-width: 100%;
    padding: 4px;
    overflow: visible;
  }

  .roulette-table {
    /*
     * Correzione fondamentale:
     * prima era min-width:900px.
     *
     * Ora l'immagine 1448x758 viene ridotta realmente
     * alla larghezza disponibile del telefono.
     */
    width: 100%;
    min-width: 0;
    max-width: 100%;
    aspect-ratio: 1448 / 758;
    overflow: visible;
    touch-action: manipulation;
  }

  .roulette-table-image {
    width: 100%;
    height: 100%;
  }

  .zero-cell,
  .number-cell,
  .outside-cell,
  .column-cell {
    touch-action: manipulation;
  }

  .zero-cell:hover,
  .number-cell:hover,
  .outside-cell:hover,
  .column-cell:hover {
    background: transparent !important;
    box-shadow: none;
  }


  /*
   * Gli hotspot restano cliccabili ma non riempiono visivamente
   * il tavolo quando questo viene ridotto.
   */
  .bet-hotspot {
    width: 20px;
    height: 20px;
    border: 0;
    background: transparent;
    box-shadow: none;
    opacity: 0;
  }

  .bet-hotspot:hover {
    opacity: 0;
    background: transparent;
  }

  .bet-hotspot.has-bet {
    opacity: 1;
  }


  /* ---------------- FICHE SUL TAVOLO ---------------- */

  .bet-chip {
    right: 0;
    width: 25px;
    height: 25px;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.55));
  }

  .bet-chip span {
    max-width: 23px;
    padding: 1px 2px;
    font-size: 6px;
  }


  /* ---------------- CONTROLLI ---------------- */

  .controls {
    position: sticky;
    z-index: 40;
    bottom: 0;
    display: grid;
    grid-template-columns: 1fr;
    gap: 3px;
    padding: 5px;
    border-top: 1px solid rgba(255,255,255,.1);
    background: rgba(5,20,28,.96);
    box-shadow: 0 -8px 18px rgba(0,0,0,.35);
    backdrop-filter: blur(8px);
  }

  .chips {
    gap: 2px;
    padding: 1px 1px 4px;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip-btn {
    width: 42px;
    height: 42px;
  }

  .chip-btn.selected {
    transform: translateY(-2px) scale(1.04);
  }

  .action-buttons {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 3px;
  }

  .control-btn {
    min-width: 0;
    min-height: 38px;
    padding: 5px 2px;
    border-radius: 8px;
    font-size: 10px;
    line-height: 1.05;
  }

  .spin-btn {
    min-width: 0;
    font-size: 13px;
  }


  /* ---------------- PUNTATE PIAZZATE ---------------- */

  .current-bets {
    padding: 5px;
  }

  .current-bets-head {
    margin-bottom: 4px;
    font-size: 9px;
  }

  #betsList {
    max-height: 105px;
    border-radius: 8px;
  }

  .bet-line {
    gap: 5px;
    padding: 5px 6px;
    font-size: 10px;
  }

  .bet-remove {
    width: 21px;
    height: 21px;
  }

  .empty-bets {
    padding: 8px;
    font-size: 10px;
  }

  .status {
    min-height: 17px;
    padding: 0 6px 6px;
    font-size: 10px;
  }
}


/* ============================================================
   MOBILE LANDSCAPE
   ============================================================ */

@media (max-height: 520px) and (orientation: landscape) {

  #app {
    padding: 3px;
  }

  header {
    grid-template-columns: auto minmax(180px,1fr) auto;
    margin-bottom: 3px;
  }

  .brand h1 {
    font-size: 16px;
  }

  .top-progress {
    grid-column: auto;
  }

  .layout {
    grid-template-columns: 190px minmax(0,1fr);
    gap: 4px;
  }

  .wheel-panel .panel-head {
    display: none;
  }

  .wheel-section {
    display: block;
    padding: 5px;
  }

  .wheel-wrap {
    width: 95px;
    max-width: 95px;
    margin: 0 auto 3px;
  }

  .result-display {
    margin-top: 3px;
  }

  .history {
    margin-top: 3px;
  }

  .bet-summary {
    margin-top: 3px;
  }

  .table-panel .panel-head {
    padding: 4px 7px;
  }

  .table-scroll {
    padding: 2px;
  }

  .chip-btn {
    width: 34px;
    height: 34px;
  }

  .control-btn {
    min-height: 32px;
  }

  .current-bets {
    display: none;
  }

  .status {
    padding-bottom: 3px;
  }
}


/* ============================================================
   CHIP SELECTOR SEPARATO
   ============================================================ */

.chip-selector {
  padding: 10px 14px 8px;
  border-top: 1px solid rgba(255,255,255,.08);
  border-bottom: 1px solid rgba(255,255,255,.08);
  background: rgba(0,0,0,.16);
}

.chip-selector-label {
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .04em;
}

.controls {
  display: block;
}

.action-buttons {
  width: 100%;
  justify-content: flex-end;
}


/* ============================================================
   MOBILE V2
   Rapporto ruota / tavolo corretto + fiche separate
   ============================================================ */

@media (max-width: 680px) {

  /* ---------------- RUOTA PIÙ GRANDE ---------------- */

  .wheel-section {
    display: block;
    padding: 8px 7px 7px;
  }

  .wheel-wrap {
    width: min(205px, 54vw);
    max-width: 205px;
    margin: 0 auto 7px;
  }

  .wheel-pointer {
    top: -2px;
    border-left-width: 8px;
    border-right-width: 8px;
    border-top-width: 15px;
  }

  .result-display {
    width: min(310px, 92%);
    margin: 0 auto 6px;
    grid-template-columns: 48px minmax(0, 1fr);
    gap: 8px;
    padding: 7px 9px;
  }

  .result-ball {
    width: 48px;
    height: 48px;
    font-size: 21px;
  }

  .history {
    width: min(340px, 96%);
    margin: 0 auto 5px;
  }

  .bet-summary {
    width: min(340px, 96%);
    margin: 0 auto;
  }


  /* ---------------- TAVOLO PIÙ PICCOLO ---------------- */

  .table-scroll {
    display: flex;
    justify-content: center;
    width: 100%;
    padding: 6px 3px;
    overflow: visible;
  }

  .roulette-table {
    /*
     * Ridotto volutamente:
     * non usa più tutta la larghezza del pannello.
     */
    width: min(88vw, 430px);
    min-width: 0;
    max-width: 88vw;
    margin: 0 auto;
    aspect-ratio: 1448 / 758;
  }


  /* ---------------- FICHE: BLOCCO AUTONOMO ---------------- */

  .chip-selector {
    padding: 7px 6px 6px;
    border-top: 1px solid rgba(231,182,84,.2);
    border-bottom: 1px solid rgba(231,182,84,.2);
    background: rgba(0,0,0,.22);
  }

  .chip-selector-label {
    margin: 0 2px 4px;
    font-size: 9px;
  }

  .chips {
    display: flex;
    width: 100%;
    gap: 5px;
    padding: 2px 2px 5px;
    overflow-x: auto;
    flex-wrap: nowrap;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip-btn {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
  }


  /* ---------------- CONTROLLI: BLOCCO SEPARATO ---------------- */

  .controls {
    position: static;
    display: block;
    padding: 7px 6px;
    border-top: 0;
    background: rgba(4,18,25,.95);
    box-shadow: none;
    backdrop-filter: none;
  }

  .action-buttons {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 5px;
    width: 100%;
  }

  .control-btn {
    min-height: 40px;
    padding: 6px 3px;
    font-size: 10px;
  }

  .spin-btn {
    grid-column: 1 / -1;
    min-height: 48px;
    font-size: 16px;
  }


  /* ---------------- RIDUCI LA PARTE BASSA ---------------- */

  .current-bets {
    padding: 5px 6px 6px;
  }

  #betsList {
    max-height: 92px;
  }
}


/* ============================================================
   TELEFONI MOLTO STRETTI
   ============================================================ */

@media (max-width: 390px) {

  .wheel-wrap {
    width: 190px;

/* ============================================================
   MOBILE V3 - LAYOUT DEFINITIVO PER ORIENTAMENTO
   ============================================================ */


/* ------------------------------------------------------------
   PORTRAIT
   Il tavolo viene ruotato di 90°.
   In questo modo i 12 numeri non vengono compressi nei 360/400px
   di larghezza del telefono.
   ------------------------------------------------------------ */

@media (max-width: 680px) and (orientation: portrait) {

  html,
  body {
    overflow-x: hidden;
  }

  #app {
    padding-left: 5px;
    padding-right: 5px;
  }

  .layout {
    display: block;
  }

  .wheel-panel,
  .table-panel {
    width: 100%;
    min-width: 0;
    margin-bottom: 7px;
  }


  /* RUOTA */

  .wheel-section {
    padding: 9px 6px 8px;
  }

  .wheel-wrap {
    width: min(275px, 70vw);
    max-width: 275px;
    margin: 0 auto 8px;
  }

  .result-display {
    width: min(350px, 96%);
  }

  .history,
  .bet-summary {
    width: min(360px, 98%);
  }


  /* TAVOLO VERTICALE */

  .table-panel {
    overflow: hidden;
  }

  .table-scroll {
    /*
     * L'immagine originale è 1448x758.
     * Dopo la rotazione:
     *
     * larghezza visibile = larghezza telefono
     * altezza visibile   = larghezza × 1448/758
     *
     * Su un telefono da 390 px:
     * circa 380 × 726 px.
     */
    --portrait-table-width: min(96vw, 430px);

    position: relative;
    display: block;
    width: 100%;
    height: calc(var(--portrait-table-width) * 1448 / 758);
    padding: 0;
    overflow: hidden;
  }

  .roulette-table {
    position: absolute;

    /*
     * Prima della rotazione la larghezza deve diventare
     * l'altezza finale del tavolo.
     */
    width: calc(var(--portrait-table-width) * 1448 / 758);
    max-width: none;
    min-width: 0;

    left: 50%;
    top: 50%;
    margin: 0;

    transform:
      translate(-50%, -50%)
      rotate(90deg);

    transform-origin: 50% 50%;
  }


  /*
   * Con il tavolo ruotato le caselle dei numeri diventano
   * circa 45-55px larghe sui telefoni normali.
   */
  .number-cell,
  .zero-cell,
  .outside-cell,
  .column-cell {
    touch-action: manipulation;
  }


  /*
   * Split / corner / street:
   * leggermente più grandi per il touch.
   */
  .bet-hotspot {
    width: 28px;
    height: 28px;
  }


  /*
   * La fiche è circolare, ma la label centrale deve restare
   * leggibile anche se il tavolo è ruotato.
   */
  .number-cell .bet-chip,
  .zero-cell .bet-chip,
  .outside-cell .bet-chip,
  .column-cell .bet-chip {
    transform:
      translateY(-50%)
      rotate(-90deg);
  }

  .bet-hotspot .bet-chip {
    transform:
      translate(-50%, -50%)
      rotate(-90deg);
  }


  /* FICHE */

  .chip-selector {
    padding: 8px 6px 6px;
  }

  .chip-btn {
    flex: 0 0 48px;
    width: 48px;
    height: 48px;
  }


  /* CONTROLLI */

  .controls {
    padding: 7px 6px 8px;
  }

  .action-buttons {
    grid-template-columns:
      repeat(3, minmax(0,1fr));
  }

  .control-btn {
    min-height: 42px;
  }

  .spin-btn {
    grid-column: 1 / -1;
    min-height: 50px;
    font-size: 17px;
  }
}

/* ============================================================
   RISULTATO SUL TAVOLO
   ============================================================ */

/*
 * Numero estratto:
 * alone dorato/bianco.
 */
.roulette-table .last-win-number {
  position: relative;
  z-index: 12 !important;

  box-shadow:
    inset 0 0 0 3px #fff4a3,
    inset 0 0 18px rgba(255,210,60,.55),
    0 0 8px rgba(255,222,90,.95),
    0 0 22px rgba(255,190,35,.85) !important;

  filter:
    brightness(1.32)
    saturate(1.12);

  animation:
    winningNumberPulse 1.15s ease-in-out infinite alternate;
}


/*
 * Puntate vincenti:
 * alone verde.
 */
.roulette-table .last-win-bet {
  position: relative;
  z-index: 11 !important;

  box-shadow:
    inset 0 0 0 3px #7dff98,
    inset 0 0 15px rgba(60,255,115,.35),
    0 0 8px rgba(90,255,130,.9),
    0 0 18px rgba(30,220,90,.7) !important;

  background-color:
    rgba(50,220,95,.22) !important;
}


/*
 * Se lo straight sul numero uscito era stato puntato,
 * il numero mantiene il bordo dorato ma riceve anche
 * un secondo alone verde.
 */
.roulette-table .last-win-number.last-win-bet {
  box-shadow:
    inset 0 0 0 3px #fff4a3,
    inset 0 0 0 6px rgba(92,255,125,.72),
    inset 0 0 18px rgba(255,210,60,.52),
    0 0 9px rgba(255,225,100,.95),
    0 0 24px rgba(60,255,110,.78) !important;
}


/*
 * Gli hotspot normalmente sono quasi invisibili.
 * Quando una puntata split/corner/street/six-line vince,
 * diventano un indicatore verde ben visibile.
 */
.bet-hotspot.last-win-bet {
  opacity: 1 !important;

  border:
    2px solid #8cff9f !important;

  background:
    rgba(20,170,70,.72) !important;

  color:
    #ffffff !important;

  box-shadow:
    0 0 0 2px rgba(0,0,0,.52),
    0 0 8px #67ff8b,
    0 0 17px rgba(70,255,120,.88) !important;

  font-weight: 950;
}


/*
 * Lo zero è un elemento separato rispetto a numberGrid.
 */
#zeroCell.last-win-number {
  z-index: 13 !important;
}


@keyframes winningNumberPulse {

  from {
    filter:
      brightness(1.18)
      saturate(1.06);
  }

  to {
    filter:
      brightness(1.48)
      saturate(1.2);
  }
}


/*
 * Su mobile riduciamo leggermente lo spessore per non
 * coprire i numeri piccoli.
 */
@media (max-width: 680px) {

  .roulette-table .last-win-number {
    box-shadow:
      inset 0 0 0 2px #fff4a3,
      inset 0 0 12px rgba(255,210,60,.5),
      0 0 6px rgba(255,222,90,.95),
      0 0 15px rgba(255,190,35,.82) !important;
  }

  .roulette-table .last-win-bet {
    box-shadow:
      inset 0 0 0 2px #7dff98,
      inset 0 0 10px rgba(60,255,115,.32),
      0 0 6px rgba(90,255,130,.9),
      0 0 13px rgba(30,220,90,.7) !important;
  }

  .roulette-table .last-win-number.last-win-bet {
    box-shadow:
      inset 0 0 0 2px #fff4a3,
      inset 0 0 0 4px rgba(92,255,125,.72),
      0 0 7px rgba(255,225,100,.95),
      0 0 16px rgba(60,255,110,.8) !important;
  }
}

function wireStatic(){document.querySelectorAll("[data-code]").forEach(b=>{const o=byCode.get(b.dataset.code);if(!o){b.title=`${b.dataset.code} non presente nel database`;return}b.dataset.optionId=o.id;b.title=`${o.label} · paga ${o.payout_profit}:1`;b.onclick=()=>place(o.id)})}
function rectFor(n){
  const p=$("#numbersWrap").getBoundingClientRect();
  const value=Number(n);

  if([0,37,38].includes(value)){
    const el=
      value===38 ? $("#tripleZeroCell")
      : value===37 ? $("#doubleZeroCell")
      : $("#zeroCell");

    if(!el)return null;

    const r=el.getBoundingClientRect();

    return{
      left:r.left-p.left,
      right:r.right-p.left,
      top:r.top-p.top,
      bottom:r.bottom-p.top,
      width:r.width,
      height:r.height,
      cx:r.left-p.left+r.width/2,
      cy:r.top-p.top+r.height/2
    };
  }

  const e=document.querySelector(`[data-number="${value}"]`);
  if(!e)return null;

  const r=e.getBoundingClientRect();

  return{
    left:r.left-p.left,
    right:r.right-p.left,
    top:r.top-p.top,
    bottom:r.bottom-p.top,
    width:r.width,
    height:r.height,
    cx:r.left-p.left+r.width/2,
    cy:r.top-p.top+r.height/2
  };
}

function hotspotPos(o){
  const r000=rectFor(38);
  const r00=rectFor(37);
  const r0=rectFor(0);
  const r1=rectFor(1);
  const r2=rectFor(2);
  const r3=rectFor(3);

  const mid=(a,b)=>(a+b)/2;

  /*
   * Zona speciale Triple Zero.
   *
   * Layout reale del tavolo:
   * - 000 nella freccia a sinistra
   * - 00 nel rettangolo alto
   * - 0  nel rettangolo basso
   * - griglia 1/2/3 immediatamente a destra
   *
   * 37 = 00
   * 38 = 000
   */
  const tripleZeroHotspots={

    /* Split fra 0 e 00 */
    SPLIT_0_00: r00&&r0 ? {
      x:mid(r00.left,r00.right),
      y:mid(r00.bottom,r0.top),
      label:"×"
    } : null,

    /* Split fra 0 e 1 */
    SPLIT_0_1: r0&&r1 ? {
      x:mid(r0.right,r1.left),
      y:mid(
        Math.max(r0.top,r1.top),
        Math.min(r0.bottom,r1.bottom)
      ),
      label:"×"
    } : null,

    /* Split fra 0 e 2 */
    SPLIT_0_2: r0&&r2 ? {
      x:mid(r0.right,r2.left),
      y:mid(
        Math.max(r0.top,r2.top),
        Math.min(r0.bottom,r2.bottom)
      ),
      label:"×"
    } : null,

    /* Split fra 00 e 2 */
    SPLIT_00_2: r00&&r2 ? {
      x:mid(r00.right,r2.left),
      y:mid(
        Math.max(r00.top,r2.top),
        Math.min(r00.bottom,r2.bottom)
      ),
      label:"×"
    } : null,

    /* Split fra 00 e 3 */
    SPLIT_00_3: r00&&r3 ? {
      x:mid(r00.right,r3.left),
      y:mid(
        Math.max(r00.top,r3.top),
        Math.min(r00.bottom,r3.bottom)
      ),
      label:"×"
    } : null,

    /* Trio 0-1-2 */
    STREET_0_1_2: r0&&r1&&r2 ? {
      x:mid(r0.right,r2.left),
      y:mid(r2.bottom,r1.top),
      label:"3"
    } : null,

    /* Trio 00-2-3 */
    STREET_00_2_3: r00&&r2&&r3 ? {
      x:mid(r00.right,r2.left),
      y:mid(r3.bottom,r2.top),
      label:"3"
    } : null,

    /* 0 / 00 / 000 */
    ANY_ZERO: r000&&r00&&r0 ? {
      x:mid(r000.right,r00.left),
      y:mid(r00.bottom,r0.top),
      label:"AZ"
    } : null,

    /* Five Number: 0-00-1-2-3 */
    FIVE_0_00_1_2_3: r00&&r0&&r2 ? {
      x:mid(r0.right,r2.left),
      y:mid(r00.bottom,r0.top),
      label:"5"
    } : null
  };

  if(Object.prototype.hasOwnProperty.call(tripleZeroHotspots,o.code)){
    return tripleZeroHotspots[o.code];
  }

  const nums=(o.numbers||[]).map(Number);
  const rs=nums.map(rectFor).filter(Boolean);
  if(!rs.length)return null;

  if(o.bet_type==="split"){
    const a=rs[0],b=rs[1];
    const overlapXLeft=Math.max(a.left,b.left);
    const overlapXRight=Math.min(a.right,b.right);
    const overlapYTop=Math.max(a.top,b.top);
    const overlapYBottom=Math.min(a.bottom,b.bottom);

    if(overlapYBottom>overlapYTop){
      return{
        x:(Math.max(a.left,b.left)+Math.min(a.right,b.right))/2,
        y:(overlapYTop+overlapYBottom)/2,
        label:"×"
      };
    }

    return{
      x:(overlapXLeft+overlapXRight)/2,
      y:(Math.max(a.top,b.top)+Math.min(a.bottom,b.bottom))/2,
      label:"×"
    };
  }

  if(o.bet_type==="corner"){
    return{
      x:(Math.max(...rs.map(r=>r.left))+Math.min(...rs.map(r=>r.right)))/2,
      y:(Math.max(...rs.map(r=>r.top))+Math.min(...rs.map(r=>r.bottom)))/2,
      label:"4"
    };
  }

  if(o.bet_type==="street"){
    return{
      x:(Math.max(...rs.map(r=>r.left))+Math.min(...rs.map(r=>r.right)))/2,
      y:Math.max(...rs.map(r=>r.bottom))-1,
      label:"3"
    };
  }

  if(o.bet_type==="six_line"){
    return{
      x:(Math.max(...rs.map(r=>r.left))+Math.min(...rs.map(r=>r.right)))/2,
      y:Math.max(...rs.map(r=>r.bottom))-1,
      label:"6"
    };
  }

  return null;
}

        Number(id)
      );
    }
  }

  renderResultHighlights();
}

function renderResultHighlights(){
  document
    .querySelectorAll(
      ".last-win-number,.last-win-bet"
    )
    .forEach(
      e=>{
        e.classList.remove(
          "last-win-number",
          "last-win-bet"
        );
      }
    );


  /*
   * Numero vincente.
   */
  if(lastWinningNumber!=null){

    const winningValue=Number(lastWinningNumber);

    const numberTarget=
      winningValue===0
      ? $("#zeroCell")
      : winningValue===37
        ? $("#doubleZeroCell")
        : winningValue===38
          ? $("#tripleZeroCell")
          : document.querySelector(
              `[data-number="${winningValue}"]`
            );


    numberTarget
      ?.classList
      .add(
        "last-win-number"
      );
  }


  /*
   * Tutte le puntate vincenti realmente piazzate
   * nell'ultimo giro.
   */
  for(
    const id
    of lastWinningOptionIds
  ){

    const option=
      byId.get(
        Number(id)
      );


    if(!option){
      continue;
    }


    const target=
      document.querySelector(
        `[data-option-id="${option.id}"]`
      )
      ||
      document.querySelector(
        `[data-code="${option.code}"]`
      );


    target
      ?.classList
      .add(
        "last-win-bet"
      );
  }
}

function place(id){if(spinning)return;id=Number(id);const o=byId.get(id),chip=Number(selectedChip),cur=Number(bets.get(id)||0);if(!o||chip<=0)return;if(cur+chip>Number(game.max_bet_per_position))return status(`Massimo ${fmtChips(game.max_bet_per_position)} sulla stessa posizione.`,true);if(game.max_total_bet!=null&&total()+chip>Number(game.max_total_bet))return status(`Massimo ${fmtChips(game.max_total_bet)} per giro.`,true);if(bets.size===0&&lastWinningNumber!=null)clearResultHighlights();bets.set(id,cur+chip);actions.push({id,amount:chip});status();renderBets()}function undo(){const a=actions.pop();if(!a)return;const n=Number(bets.get(a.id)||0)-a.amount;n>0?bets.set(a.id,n):bets.delete(a.id);renderBets()}function clearBets(){bets.clear();actions=[];renderBets()}function remove(id){bets.delete(Number(id));actions=actions.filter(a=>a.id!==Number(id));renderBets()}function repeat(){if(!previous.length)return status("Nessuna puntata precedente.",true);const t=previous.reduce((s,x)=>s+Number(x.amount),0);if(game.max_total_bet!=null&&t>Number(game.max_total_bet))return status("La puntata precedente supera il limite attuale.",true);if(lastWinningNumber!=null)clearResultHighlights();bets.clear();actions=[];previous.forEach(x=>{bets.set(Number(x.option_id),Number(x.amount));actions.push({id:Number(x.option_id),amount:Number(x.amount)})});renderBets()}
function renderBets(){$("#totalBetValue").textContent=fmtChips(total());$("#positionCount").textContent=`${bets.size} ${bets.size===1?"posizione":"posizioni"}`;$("#betsList").innerHTML=bets.size?[...bets].map(([id,a])=>`<div class="bet-line"><span>${byId.get(id)?.label||id}</span><strong>${fmtChips(a)}</strong><button class="bet-remove" data-rm="${id}">×</button></div>`).join(""):`<div class="empty-bets">Nessuna puntata.</div>`;document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>remove(b.dataset.rm));markers()}
function markerChipValue(id,totalAmount){for(let i=actions.length-1;i>=0;i--){if(Number(actions[i].id)===Number(id)&&allowedChips.includes(Number(actions[i].amount)))return Number(actions[i].amount)}const sorted=[...allowedChips].map(Number).sort((a,b)=>b-a);return sorted.find(v=>v<=Number(totalAmount))||sorted[sorted.length-1]||1}
function markers(){document.querySelectorAll(".bet-chip").forEach(e=>e.remove());document.querySelectorAll(".bet-hotspot").forEach(e=>e.classList.remove("has-bet"));for(const[id,a]of bets){const o=byId.get(id);let t=document.querySelector(`[data-option-id="${o?.id}"]`)||document.querySelector(`[data-code="${o?.code}"]`);if(!t)continue;t.classList.add("has-bet");const chipValue=markerChipValue(id,a),s=document.createElement("span");s.className="bet-chip";s.innerHTML=`<img src="../shared/assets/chips/${chipAssetName(chipValue)}" alt=""><span>${compact(a)}</span>`;t.appendChild(s)}renderResultHighlights()}
async function play(){if(spinning||!bets.size)return !bets.size&&status("Piazza almeno una puntata.",true);const payload=[...bets].map(([id,a])=>({option_id:Number(id),amount:Number(a)}));busy(true);status("La ruota gira…");try{const{data,error}=await supabase.rpc("play_roulette",{p_game_id:GAME_ID,p_bets:payload});if(error)throw error;previous=payload.map(x=>({...x}));await animateWheel(data.result.number);apply(data);bets.clear();actions=[];renderBets();if("BroadcastChannel"in window){const c=new BroadcastChannel("slot-machine-sync");c.postMessage({type:"balance-changed"});c.close()}localStorage.setItem("slot-machine-balance-sync",String(Date.now()))}catch(e){console.error(e);status(e?.message||String(e),true)}finally{busy(false)}}
function apply(d){const n=Number(d.result.number),c=d.result.color||color(n);setResultHighlights(n);$("#resultBall").className=`result-ball ${c}`;$("#resultBall").textContent=displayNumber(n);$("#resultTitle").textContent=`${displayNumber(n)} · ${c==="red"?"ROSSO":c==="black"?"NERO":"VERDE"}`;const wc=Array.isArray(d.winning_bets)?d.winning_bets.length:0;$("#resultSubtitle").textContent=wc?`${wc} ${wc===1?"puntata vincente":"puntate vincenti"}`:"Nessuna puntata vincente";$("#balanceValue").textContent=fmtChips(d.balance);$("#lastReturnValue").textContent=fmtChips(d.total_return);const net=Number(d.net_result||0);$("#lastNetValue").textContent=`${net>0?"+":""}${fmtChips(net)}`;$("#netRow").classList.toggle("net-positive",net>0);$("#netRow").classList.toggle("net-negative",net<0);if(d.xp)updateXp(d.xp.total,d.xp.level);recent.unshift(n);recent=recent.slice(0,15);renderHistory();status(net>0?`Vincita netta: +${fmtChips(net)} fiche`:net<0?`Risultato netto: ${fmtChips(net)} fiche`:"Pareggio.")}
function renderHistory(){$("#numberHistory").innerHTML=recent.map(n=>`<span class="history-number ${color(n)}">${displayNumber(n)}</span>`).join("")}
async function waitForTableImage(){
  const img=document.querySelector(".roulette-table-image");
  if(!img)return;
  if(img.complete&&img.naturalWidth>0)return;
  try{await img.decode()}catch(_){await new Promise(r=>img.addEventListener("load",r,{once:true}))}
}

async function init(){try{
  if(new URLSearchParams(location.search).get("debugGrid")==="1")document.body.classList.add("debug-grid");
  const{data,error}=await supabase.auth.getSession();if(error)throw error;session=data.session;if(!session){location.href="../";return}buildWheel();buildNumbers();await waitForTableImage();await Promise.all([loadProfile(),loadLevels(),loadConfig(),loadOptions(),loadRecent()]);await loadProgress();requestAnimationFrame(()=>{renderHotspots();renderBets()});$("#loadingOverlay").classList.add("hidden");try{const levelUp=await CasinoLevelUp.check();if(levelUp?.balance!=null)$("#balanceValue").textContent=fmtChips(levelUp.balance)}catch(levelError){console.warn("Level-up pendente roulette:",levelError)}}catch(e){console.error(e);$("#loadingText").textContent="Errore";$("#loadingError").textContent=e?.message||String(e)}}
$("#undoBtn").onclick=undo;$("#clearBtn").onclick=clearBets;$("#repeatBtn").onclick=repeat;$("#spinBtn").onclick=play;let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderHotspots,100)});document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&session&&!spinning){try{await Promise.all([loadProfile(),loadProgress()])}catch(e){console.warn(e)}}});await init();
</script>
