<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07151d" />
  <title>Scommesse sportive</title>
  <link rel="stylesheet" href="../shared/game-header.css" />

  <style>
    :root {
      --bg: #07151d;
      --panel: rgba(10, 32, 43, .92);
      --panel2: rgba(20, 47, 58, .92);
      --gold: #e7b654;
      --gold-light: #ffe19a;
      --text: #f4f7f9;
      --muted: #9eb0b8;
      --danger: #ff7777;
      --ok: #77e18a;
      --blue: #62a8ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, #163b4d 0%, #091820 45%, #040b10 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: default;
      opacity: .45;
    }

    .hidden {
      display: none !important;
    }

    #app {
      min-height: 100vh;
      padding: 18px;
    }

    .shell {
      width: min(1500px, 100%);
      margin: 0 auto;
    }

    /* ========================================================
       LAYOUT
       ======================================================== */

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 370px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      border: 1px solid rgba(231,182,84,.33);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(15,43,55,.95), rgba(6,22,30,.96));
      box-shadow: 0 14px 35px rgba(0,0,0,.26), inset 0 0 20px rgba(255,211,118,.035);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .panel-head h2 {
      margin: 0;
      color: var(--gold-light);
      font-size: 18px;
    }

    .panel-head small {
      color: var(--muted);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 7px;
    }

    .panel-action-btn {
      min-height: 34px;
      border: 1px solid rgba(231,182,84,.34);
      border-radius: 9px;
      padding: 6px 10px;
      background: rgba(4,16,23,.76);
      color: var(--gold-light);
      font-weight: 850;
      font-size: 11px;
      white-space: nowrap;
    }

    .panel-action-btn:hover {
      border-color: rgba(255,225,154,.82);
      filter: brightness(1.08);
    }

    /* ========================================================
       FILTRI
       ======================================================== */

    .filters {
      display: grid;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.10);
    }

    .filter-row {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .filter-btn {
      flex: 0 0 auto;
      min-height: 35px;
      border: 1px solid rgba(231,182,84,.34);
      border-radius: 999px;
      padding: 6px 11px;
      background: rgba(0,0,0,.22);
      color: #e8eef1;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: rgba(255,225,154,.82);
      background: rgba(122,78,18,.34);
      color: var(--gold-light);
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(231,182,84,.34);
      border-radius: 10px;
      padding: 8px 11px;
      outline: none;
      background: rgba(0,0,0,.24);
      color: white;
    }

    .search-input:focus {
      border-color: rgba(255,225,154,.78);
      box-shadow: 0 0 0 3px rgba(231,182,84,.08);
    }

    /* ========================================================
       PALINSESTO
       ======================================================== */

    .events-host {
      padding: 12px;
    }

    .day-group + .day-group {
      margin-top: 10px;
    }

    .day-title {
      width: 100%;
      min-height: 48px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      border: 1px solid rgba(231,182,84,.28);
      border-radius: 12px;
      padding: 9px 11px;
      background: linear-gradient(180deg, rgba(19,48,59,.92), rgba(7,25,33,.94));
      color: #d9e4e8;
      text-align: left;
      font-weight: 900;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .055em;
    }

    .day-title:hover {
      border-color: rgba(255,225,154,.56);
      background: linear-gradient(180deg, rgba(26,58,70,.96), rgba(9,30,39,.96));
    }

    .day-title-main,
    .day-title-meta {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-title-main span:not(.day-chevron) {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .day-chevron {
      width: 18px;
      flex: 0 0 18px;
      color: var(--gold-light);
      font-size: 14px;
      line-height: 1;
      transition: transform .18s ease;
    }

    .day-group.open .day-chevron {
      transform: rotate(90deg);
    }

    .day-title small {
      color: var(--muted);
      font-weight: 650;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .day-selected-count {
      padding: 4px 7px;
      border: 1px solid rgba(255,225,154,.35);
      border-radius: 999px;
      background: rgba(160,101,24,.24);
      color: var(--gold-light);
      font-size: 10px;
      font-weight: 900;
      text-transform: none;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .day-content {
      display: none;
      padding-top: 8px;
    }

    .day-group.open .day-content {
      display: block;
    }

    .league-block {
      overflow: hidden;
      margin-bottom: 10px;
      border: 1px solid rgba(231,182,84,.20);
      border-radius: 14px;
      background: rgba(0,0,0,.14);
    }

    .league-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-bottom: 1px solid rgba(255,255,255,.055);
      background: rgba(255,255,255,.025);
    }

    .league-head strong {
      color: var(--gold-light);
      font-size: 13px;
    }

    .league-head span {
      color: var(--muted);
      font-size: 11px;
    }

    .event-card + .event-card {
      border-top: 1px solid rgba(255,255,255,.06);
    }

    .event-main {
      display: grid;
      grid-template-columns: 74px minmax(180px, 1fr) minmax(260px, .9fr) auto;
      gap: 10px;
      align-items: center;
      padding: 11px;
    }

    .event-time {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .event-time strong {
      display: block;
      margin-top: 2px;
      color: #edf4f6;
      font-size: 14px;
    }

    .teams {
      min-width: 0;
    }

    .team {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #f5f8fa;
      font-weight: 800;
      font-size: 14px;
    }

    .team + .team {
      margin-top: 5px;
    }

    .main-odds,
    .market-options {
      display: grid;
      gap: 6px;
    }

    .main-odds {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .odd-btn {
      min-width: 0;
      min-height: 42px;
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(231,182,84,.30);
      border-radius: 9px;
      padding: 6px 8px;
      background: rgba(4,16,23,.78);
      color: white;
    }

    .odd-btn:hover {
      border-color: rgba(255,225,154,.78);
      transform: translateY(-1px);
    }

    .odd-btn.selected {
      border-color: #ffe19a;
      background: linear-gradient(180deg, rgba(186,116,34,.75), rgba(100,52,14,.75));
      box-shadow: 0 0 12px rgba(255,194,61,.16);
    }

    .odd-label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      text-transform: uppercase;
    }

    .odd-value {
      justify-self: end;
      color: var(--gold-light);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .more-btn {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(231,182,84,.35);
      border-radius: 50%;
      background: rgba(4,16,23,.75);
      color: var(--gold-light);
      font-weight: 950;
    }

    .event-extra {
      display: none;
      padding: 0 11px 12px;
    }

    .event-card.expanded .event-extra {
      display: block;
    }

    .markets-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .market-box {
      min-width: 0;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 10px;
      padding: 8px;
      background: rgba(0,0,0,.17);
    }

    .market-title {
      margin-bottom: 6px;
      color: #c9d6db;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .035em;
    }

    .market-options.two {
      grid-template-columns: repeat(2, minmax(0,1fr));
    }

    .market-options.three {
      grid-template-columns: repeat(3, minmax(0,1fr));
    }

    .empty-state,
    .error-state {
      padding: 36px 18px;
      color: var(--muted);
      text-align: center;
    }

    .error-state {
      color: #ffabab;
    }

    /* ========================================================
       BETSLIP
       ======================================================== */

    .betslip {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .betslip > .panel-head {
      flex: 0 0 auto;
    }

    .betslip-body {
      min-height: 0;
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
    }

    .selection-list {
      min-height: 0;
      flex: 1 1 auto;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 12px;
      scrollbar-width: thin;
      scrollbar-color: rgba(231,182,84,.55) rgba(255,255,255,.05);
    }

    .selection-list::-webkit-scrollbar {
      width: 8px;
    }

    .selection-list::-webkit-scrollbar-track {
      background: rgba(255,255,255,.04);
      border-radius: 999px;
    }

    .selection-list::-webkit-scrollbar-thumb {
      background: rgba(231,182,84,.48);
      border-radius: 999px;
    }

    .betslip-controls {
      flex: 0 0 auto;
      padding: 0 12px 12px;
      border-top: 1px solid rgba(255,255,255,.07);
      background: linear-gradient(180deg, rgba(8,28,37,.98), rgba(5,20,28,.99));
      box-shadow: 0 -10px 22px rgba(0,0,0,.18);
    }

    .betslip-empty {
      padding: 32px 14px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    .selection-card {
      position: relative;
      padding: 10px 35px 10px 10px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 11px;
      background: rgba(0,0,0,.18);
    }

    .selection-card + .selection-card {
      margin-top: 7px;
    }

    .selection-remove {
      position: absolute;
      top: 7px;
      right: 7px;
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: #cbd6da;
    }

    .selection-match {
      color: #dce6ea;
      font-size: 11px;
      font-weight: 750;
    }

    .selection-market {
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
    }

    .selection-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 3px;
    }

    .selection-main strong:first-child {
      color: white;
    }

    .selection-odd {
      color: var(--gold-light);
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .slip-summary {
      display: grid;
      gap: 6px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .summary-row strong {
      color: #edf4f6;
      font-variant-numeric: tabular-nums;
    }

    .summary-row.bonus strong {
      color: #8fe7a3;
    }

    .summary-row.total {
      margin-top: 2px;
      padding-top: 7px;
      border-top: 1px solid rgba(255,255,255,.07);
      font-size: 13px;
    }

    .summary-row.total strong {
      color: var(--gold-light);
      font-size: 17px;
    }

    .limit-bar {
      height: 7px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0,0,0,.35);
    }

    .limit-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #2769ff, #e7b654, #ff7777);
      transition: width .2s ease;
    }

    .stake-wrap {
      margin-top: 12px;
    }

    .stake-wrap label {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .stake-input {
      width: 100%;
      min-height: 45px;
      border: 1px solid rgba(231,182,84,.42);
      border-radius: 10px;
      padding: 8px 11px;
      background: rgba(0,0,0,.28);
      color: white;
      font-weight: 850;
      outline: none;
      font-variant-numeric: tabular-nums;
    }

    .stake-input:focus {
      border-color: rgba(255,225,154,.82);
    }

    .potential-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding: 10px 11px;
      border: 1px solid rgba(231,182,84,.24);
      border-radius: 11px;
      background: rgba(122,78,18,.14);
    }

    .potential-box span {
      color: var(--muted);
      font-size: 11px;
    }

    .potential-box strong {
      color: var(--gold-light);
      font-size: 19px;
      font-variant-numeric: tabular-nums;
    }

    .place-btn {
      width: 100%;
      min-height: 49px;
      margin-top: 10px;
      border: 1px solid #f4cd72;
      border-radius: 11px;
      background: linear-gradient(#d99a32, #8c4614);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
    }

    .place-btn:not(:disabled):hover {
      filter: brightness(1.08);
    }

    .slip-status {
      min-height: 18px;
      margin-top: 8px;
      color: #ffd083;
      font-size: 11px;
      text-align: center;
    }

    .slip-status.ok {
      color: var(--ok);
    }

    .slip-status.bad {
      color: #ff9d9d;
    }


    .bet-mode-switch {
      display: inline-grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      margin-top: 8px;
      padding: 3px;
      border: 1px solid rgba(231,182,84,.24);
      border-radius: 10px;
      background: rgba(0,0,0,.18);
    }

    .bet-mode-btn {
      min-height: 30px;
      border: 0;
      border-radius: 7px;
      padding: 5px 9px;
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .bet-mode-btn.active {
      background: rgba(160,101,24,.34);
      color: var(--gold-light);
      box-shadow: inset 0 0 0 1px rgba(255,225,154,.24);
    }

    .system-event-card {
      padding: 10px;
      border: 1px solid rgba(255,255,255,.085);
      border-radius: 11px;
      background: rgba(0,0,0,.18);
    }

    .system-event-card + .system-event-card {
      margin-top: 8px;
    }

    .system-event-head {
      margin-bottom: 7px;
      color: #dce6ea;
      font-size: 11px;
      font-weight: 800;
    }

    .system-selection-row {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto auto;
      gap: 8px;
      align-items: center;
      min-height: 34px;
      padding: 6px 4px;
      border-top: 1px solid rgba(255,255,255,.055);
    }

    .system-selection-row:first-of-type {
      border-top: 0;
    }

    .system-selection-text {
      min-width: 0;
    }

    .system-selection-text strong {
      display: block;
      color: white;
      font-size: 11px;
    }

    .system-selection-text small {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .system-selection-remove {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.07);
      color: #cbd6da;
    }

    .system-hint {
      margin-top: 8px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    .system-hint.ready {
      color: var(--ok);
    }

    /* ========================================================
       RIEPILOGO SCHEDINA MOBILE
       ======================================================== */

    .mobile-slip-bar {
      display: none;
    }

    /* ========================================================
       TOAST / LOADING
       ======================================================== */

    .toast-host {
      position: fixed;
      z-index: 1500;
      right: 16px;
      bottom: 16px;
      display: grid;
      gap: 8px;
      width: min(360px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      padding: 11px 13px;
      border: 1px solid rgba(231,182,84,.38);
      border-radius: 12px;
      background: rgba(4,16,23,.96);
      color: #eef5f7;
      box-shadow: 0 12px 30px rgba(0,0,0,.42);
      font-size: 12px;
    }

    .toast.bad {
      border-color: rgba(255,119,119,.50);
    }

    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2,8,12,.95);
    }

    .loading-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid rgba(231,182,84,.60);
      border-radius: 18px;
      background: #071a23;
      text-align: center;
    }

    .loader {
      width: 52px;
      height: 52px;
      margin: 0 auto 13px;
      border: 6px solid rgba(255,255,255,.12);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-card strong {
      color: var(--gold-light);
    }

    /* ========================================================
       RESPONSIVE
       ======================================================== */

    @media (max-width: 1120px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 330px;
      }

      .event-main {
        grid-template-columns: 66px minmax(150px, 1fr) minmax(230px, .9fr) auto;
      }
    }

    @media (max-width: 930px) {
      #app {
        padding: 10px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .betslip {
        position: static;
        max-height: none;
        overflow: visible;
        scroll-margin-top: 10px;
      }

      .betslip-body {
        overflow: visible;
      }

      .selection-list {
        max-height: none;
        overflow: visible;
      }

      body.has-mobile-slip #app {
        padding-bottom: 88px;
      }

      body.has-mobile-slip .toast-host {
        bottom: 88px;
      }

      .mobile-slip-bar {
        position: fixed;
        z-index: 1200;
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: max(8px, env(safe-area-inset-bottom));
        min-height: 66px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border: 1px solid rgba(255,225,154,.68);
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(13,42,53,.98), rgba(5,20,27,.99));
        box-shadow: 0 14px 34px rgba(0,0,0,.58), inset 0 0 18px rgba(255,211,118,.035);
        backdrop-filter: blur(12px);
        opacity: 0;
        transform: translateY(calc(100% + 22px));
        pointer-events: none;
        transition: opacity .18s ease, transform .18s ease;
      }

      .mobile-slip-bar.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      body.betslip-in-view .mobile-slip-bar.visible {
        opacity: 0;
        transform: translateY(calc(100% + 22px));
        pointer-events: none;
      }

      .mobile-slip-info {

      ? window.CasinoFormat.formatChips(value)

  function fmtOdd(value) {
    return oddsFormatter.format(Number(value || 0));
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function localDateKey(dateValue) {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Rome",
      year: "numeric",
      month: "2-digit",
      day: "2-digit"
    }).formatToParts(new Date(dateValue));

    const year = parts.find(p => p.type === "year")?.value;
    const month = parts.find(p => p.type === "month")?.value;
    const day = parts.find(p => p.type === "day")?.value;
    return `${year}-${month}-${day}`;
  }

  function todayRomeKey(offsetDays = 0) {
    const date = new Date(Date.now() + offsetDays * 86400000);
    return localDateKey(date);
  }

  function formatDayLabel(dateKey) {
    const today = todayRomeKey(0);
    const tomorrow = todayRomeKey(1);

    if (dateKey === today) return "Oggi";
    if (dateKey === tomorrow) return "Domani";

    const [year, month, day] = dateKey.split("-").map(Number);
    const date = new Date(Date.UTC(year, month - 1, day, 12));

    return new Intl.DateTimeFormat("it-IT", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      timeZone: "Europe/Rome"
    }).format(date);
  }

  function formatKickoff(value) {
    const date = new Date(value);
    return new Intl.DateTimeFormat("it-IT", {
      hour: "2-digit",
      minute: "2-digit",
      timeZone: "Europe/Rome"
    }).format(date);
  }

  function sportsBonusPercent(legCount) {
    return MULTIPLE_BONUSES[legCount] ?? 0;
  }

  function calculateTicket(selections = state.selections) {
    const baseOdd = selections.reduce(
      (total, selection) => total * Number(selection.odd),
      1
    );

    const bonusPercent = sportsBonusPercent(selections.length);
    const bonusMultiplier = 1 + bonusPercent / 100;
    const finalOdd = baseOdd * bonusMultiplier;

    return {
      baseOdd,
      bonusPercent,
      bonusMultiplier,
      finalOdd
    };
  }

  function toast(message, bad = false) {

  async function loadLevels() {
    const { data, error } = await supabase
      .from("levels")
      .select("level,xp_required")
      .order("level");

    if (error) throw error;
    state.levels = data || [];
  }

  function updateXp(xp, level) {
    xp = Number(xp || 0);
    level = Number(level || 1);

    $("#xpLevel").textContent = String(level);

    if (level >= 500) {
      $("#xpFill").style.width = "100%";
      $("#xpText").textContent = `${formatCompact(xp)} XP · MAX`;
      return;
    }

    const current = state.levels.find(row => Number(row.level) === level);
    const next = state.levels.find(row => Number(row.level) === level + 1);

    const currentXp = current ? Number(current.xp_required) : level === 1 ? 0 : null;
    const nextXp = next ? Number(next.xp_required) : null;

    if (currentXp == null || nextXp == null) {
      $("#xpText").textContent = `${formatCompact(xp)} XP`;
      return;
    }

    const into = Math.max(0, xp - currentXp);
    const need = Math.max(1, nextXp - currentXp);
    const percent = Math.max(0, Math.min(100, into / need * 100));

    $("#xpFill").style.width = `${percent}%`;
    $("#xpText").textContent = `${formatCompact(into)} / ${formatCompact(need)} XP`;
    $("#xpText").title = `${fmtNumber(into)} / ${fmtNumber(need)} XP`;
  }

  async function loadProfileAndProgression() {
    const userId = state.session.user.id;

    const [profileResult, progressionResult] = await Promise.all([

        .eq("user_id", userId)
        .single(),

      supabase
        .from("user_progression")
        .select("xp,level")
        .eq("user_id", userId)
        .maybeSingle()
    ]);

    if (profileResult.error) throw profileResult.error;
    if (progressionResult.error) throw progressionResult.error;

    state.profile = profileResult.data;
    state.progression = progressionResult.data || { xp: 0, level: 1 };
    $("#balanceValue").textContent = formatChips(state.profile?.chips || 0);
    updateXp(state.progression.xp, state.progression.level);
  }

      `)

  function filteredEvents() {
    const search = state.search.trim().toLowerCase();
    const today = todayRomeKey(0);
    const tomorrow = todayRomeKey(1);

    return state.events.filter(event => {
      if (state.leagueFilter !== "all" && event.league_name !== state.leagueFilter) {
        return false;
      }

      const eventDate = localDateKey(event.match_date);

      if (state.dateFilter === "today" && eventDate !== today) return false;
      if (state.dateFilter === "tomorrow" && eventDate !== tomorrow) return false;

      if (search) {
        const haystack = `${event.home_team} ${event.away_team} ${event.league_name}`.toLowerCase();
        if (!haystack.includes(search)) return false;
      }

      return true;
    });
  }

  function renderLeagueFilters() {
    const leagues = [...new Set(state.events.map(event => event.league_name).filter(Boolean))]

    $("#leagueFilters").innerHTML = [

      ...leagues.map(league => `

  function selectionKey(selection) {
    return `${Number(selection.eventId)}:${String(selection.marketId)}:${String(selection.outcomeId)}`;
  }

  function selectionIsSelected(eventId, marketId, outcomeId) {
    return state.selections.some(selection =>
      Number(selection.eventId) === Number(eventId)
      && String(selection.marketId) === String(marketId)
      && String(selection.outcomeId) === String(outcomeId)
    );
  }

  function groupSelectionsByEvent(selections = state.selections) {
    const groups = new Map();

    for (const selection of selections) {
      const eventId = Number(selection.eventId);
      if (!groups.has(eventId)) groups.set(eventId, []);
      groups.get(eventId).push(selection);
    }

    return [...groups.values()];
  }

  function generateSystemCombinations(selections = state.selections) {
    const groups = groupSelectionsByEvent(selections);

    if (!groups.length) return [];

    let combinations = [[]];

    for (const group of groups) {
      const next = [];

      for (const combination of combinations) {
        for (const selection of group) {
          next.push([...combination, selection]);

          if (next.length > 500) {
            return next;
          }
        }
      }

      combinations = next;
    }

    return combinations;
  }

  function calculateSystem(selections = state.selections, stakePerCombination = 0) {
    const groups = groupSelectionsByEvent(selections);
    const eventCount = groups.length;
    const selectionCount = selections.length;

    const combinationCount = groups.reduce(
      (total, group) => total * Math.max(1, group.length),
      groups.length ? 1 : 0
    );

    const valid =
      eventCount >= 2
      && selectionCount >= 3
      && combinationCount >= 2
      && combinationCount <= 500;

    const bonusPercent = sportsBonusPercent(eventCount);
    const bonusMultiplier = 1 + bonusPercent / 100;

    let minFinalOdd = 0;
    let maxFinalOdd = 0;
    let totalPotentialWin = 0;
    let hasOddOverLimit = false;

    const combinations = combinationCount <= 500
      ? generateSystemCombinations(selections)
      : [];

    combinations.forEach((combination, index) => {
      const baseOdd = combination.reduce(
        (total, selection) => total * Number(selection.odd || 0),
        1
      );

      const finalOdd = baseOdd * bonusMultiplier;

      if (index === 0 || finalOdd < minFinalOdd) minFinalOdd = finalOdd;
      if (finalOdd > maxFinalOdd) maxFinalOdd = finalOdd;
      if (finalOdd > MAX_TOTAL_ODD) hasOddOverLimit = true;

      if (stakePerCombination > 0) {
        totalPotentialWin += Math.floor(stakePerCombination * finalOdd);
      }
    });

    return {
      groups,
      combinations,
      eventCount,
      selectionCount,
      combinationCount,
      valid,
      bonusPercent,
      bonusMultiplier,
      minFinalOdd,
      maxFinalOdd,
      hasOddOverLimit,
      stakePerCombination,
      totalStake: Math.floor(stakePerCombination * combinationCount),
      totalPotentialWin
    };
  }

  function renderEvents() {
    const events = filteredEvents();
    $("#eventsCount").textContent = `${events.length} partite disponibili`;

    if (!events.length) {
      $("#eventsHost").innerHTML = `<div class="empty-state">Nessuna partita corrisponde ai filtri selezionati.</div>`;
      return;
    }

    const byDay = new Map();

    for (const event of events) {
      const day = localDateKey(event.match_date);
      if (!byDay.has(day)) byDay.set(day, new Map());
      const leagues = byDay.get(day);
      if (!leagues.has(event.league_name)) leagues.set(event.league_name, []);
      leagues.get(event.league_name).push(event);
    }

    if (!state.dayStateInitialized) {
      const today = todayRomeKey(0);
      if (byDay.has(today)) state.openDays.add(today);
      state.dayStateInitialized = true;
    }

    const html = [...byDay.entries()].map(([day, leagues]) => {
      const dayCount = [...leagues.values()].reduce((sum, rows) => sum + rows.length, 0);
      const selectedCount = state.selections.filter(selection => localDateKey(selection.matchDate) === day).length;
      const isOpen = state.openDays.has(day);

      const leagueHtml = [...leagues.entries()].map(([league, rows]) => `
        <section class="league-block">
          <div class="league-head">
            <strong>${escapeHtml(league)}</strong>
            <span>${rows.length} ${rows.length === 1 ? "partita" : "partite"}</span>
          </div>
          ${rows.map(renderEventCard).join("")}
        </section>
      `).join("");

      return `
        <section class="day-group${isOpen ? " open" : ""}" data-day-group="${escapeHtml(day)}">
          <button
            class="day-title"
            type="button"
            data-toggle-day="${escapeHtml(day)}"
            aria-expanded="${isOpen ? "true" : "false"}"
          >
            <span class="day-title-main">
              <span class="day-chevron">▶</span>
              <span>${escapeHtml(formatDayLabel(day))}</span>
            </span>
            <span class="day-title-meta">
              ${selectedCount ? `<span class="day-selected-count">🎫 ${selectedCount}</span>` : ""}
              <small>${dayCount} ${dayCount === 1 ? "evento" : "eventi"}</small>
            </span>
          </button>
          <div class="day-content">
            ${leagueHtml}
          </div>
        </section>
      `;
    }).join("");

    $("#eventsHost").innerHTML = html;
  }

  function addSelectionFromButton(button) {
    const eventId = Number(button.dataset.eventId);
    const event = state.events.find(row => Number(row.id) === eventId);
    if (!event) return;

    const nextSelection = {
      eventId,
      marketId: String(button.dataset.marketId),
      outcomeId: String(button.dataset.outcomeId),
      marketName: String(button.dataset.marketName),
      selectionName: String(button.dataset.selectionName),
      odd: Number(button.dataset.odd),
      homeTeam: event.home_team,
      awayTeam: event.away_team,
      matchDate: event.match_date
    };

    const exactIndex = state.selections.findIndex(
      selection => selectionKey(selection) === selectionKey(nextSelection)
    );

    if (exactIndex >= 0) {
      state.selections.splice(exactIndex, 1);
      renderEvents();
      renderBetslip();
      return;
    }

    if (state.selections.length >= 30) {
      toast("Massimo 30 selezioni per schedina.", true);
      return;
    }

    let candidate = [...state.selections];

    if (state.betMode === "multiple") {
      const existingEventIndex = candidate.findIndex(
        selection => Number(selection.eventId) === eventId
      );

      if (existingEventIndex >= 0) {
        candidate[existingEventIndex] = nextSelection;
      } else {
        candidate.push(nextSelection);
      }

      const calculation = calculateTicket(candidate);

      if (calculation.finalOdd > MAX_TOTAL_ODD) {
        toast("La selezione porterebbe la quota oltre il limite x50.000.", true);
        return;
      }
    } else {
      candidate.push(nextSelection);

      const system = calculateSystem(candidate);

      if (system.combinationCount > 500) {
        toast("Il sistema supererebbe il limite di 500 combinazioni.", true);
        return;
      }

      if (system.hasOddOverLimit) {
        toast("Almeno una combinazione supererebbe il limite x50.000.", true);
        return;
      }
    }

    state.selections = candidate;
    renderEvents();
    renderBetslip();
  }

  let betslipObserver = null;

  function initMobileBetslipObserver() {
    const slip = document.querySelector(".betslip");
    if (!slip || !("IntersectionObserver" in window)) return;

    betslipObserver?.disconnect();
    betslipObserver = new IntersectionObserver(entries => {
      const visible = entries.some(entry => entry.isIntersecting);
      document.body.classList.toggle("betslip-in-view", visible);
    }, {
      threshold: .06
    });

    betslipObserver.observe(slip);
  }

      )}`;

  function readableRpcError(error) {
    const message = error?.message || "Errore durante il piazzamento.";

    switch (message) {
      case "MAX_ODD_EXCEEDED":
        return "Quota complessiva superiore al limite x50.000.";
      case "INSUFFICIENT_CHIPS":
        return "Fiche insufficienti.";
      case "EVENT_STARTED":
        return "Una delle partite è già iniziata.";
      case "EVENT_CLOSED":
        return "Una delle partite non è più disponibile.";
      case "ODD_UNAVAILABLE":
        return "Una quota selezionata non è più disponibile.";
      case "DUPLICATE_EVENT":
        return "Puoi inserire una sola selezione per partita.";
      case "DUPLICATE_SELECTION":
        return "La stessa selezione è già presente.";
      case "INVALID_SYSTEM":
        return "Il sistema deve avere almeno 2 eventi e almeno una partita con più selezioni.";
      case "TOO_MANY_SELECTIONS":
        return "Massimo 30 selezioni complessive.";
      case "TOO_MANY_COMBINATIONS":
        return "Il sistema supera il limite di 500 combinazioni.";
      default:
        return error?.details || message;
    }
  }

  async function placeBet() {
    if (state.busy || !state.selections.length) return;

    const input = $("#stakeInput");
    const stake = Math.floor(Number(input?.value || 0));

    if (!Number.isInteger(stake) || stake <= 0) {
      toast(
        state.betMode === "system"
          ? "Inserisci una puntata valida per combinazione."
          : "Inserisci una puntata valida.",
        true
      );
      return;
    }

    if (state.betMode === "system") {
      const system = calculateSystem(state.selections, stake);

      if (!system.valid) {
        toast(
          "Per il sistema servono almeno 2 eventi e almeno una partita con più selezioni.",
          true
        );
        return;
      }

      if (system.combinationCount > 500) {
        toast("Il sistema supera il limite di 500 combinazioni.", true);
        return;
      }

      if (system.hasOddOverLimit) {
        toast("Almeno una combinazione supera il limite x50.000.", true);
        return;
      }

      if (Number(state.profile?.chips || 0) < system.totalStake) {
        toast("Fiche insufficienti per la puntata totale del sistema.", true);
        return;
      }

      state.busy = true;
      renderBetslip();

      try {
        const { data, error } = await supabase.rpc("place_system_bet", {
          p_stake_per_combination: stake,
          p_request_id: crypto.randomUUID(),
          p_selections: state.selections.map(selection => ({
            event_id: selection.eventId,
            market_id: selection.marketId,
            outcome_id: selection.outcomeId
          }))
        });

        if (error) throw error;

        if (data?.balance != null) {
          state.profile.chips = Number(data.balance);
          $("#balanceValue").textContent = formatChips(data.balance);
        }

        balanceSyncChannel?.postMessage({ type: "balance-changed" });

        toast(
          `Sistema #${data.system_id} piazzato · ${data.combination_count} combinazioni · puntata totale ${formatChips(data.total_stake)} · potenziale ${formatChips(data.max_potential_win)} fiche.`
        );

        state.selections = [];

        await Promise.all([
          loadProfileAndProgression(),
          loadEvents()
        ]);

        const levelUp = await CasinoLevelUp.check();

        if (levelUp?.balance != null) {
          state.profile.chips = Number(levelUp.balance);
          $("#balanceValue").textContent = formatChips(levelUp.balance);
        }

      } catch (error) {
        console.error("place_system_bet:", error);
        toast(readableRpcError(error), true);
      } finally {
        state.busy = false;
        renderBetslip();
      }

      return;
    }

    if (Number(state.profile?.chips || 0) < stake) {
      toast("Fiche insufficienti.", true);
      return;
    }

    const calculation = calculateTicket();

    if (calculation.finalOdd > MAX_TOTAL_ODD) {
      toast("Quota complessiva superiore al limite x50.000.", true);
      return;
    }

    state.busy = true;
    renderBetslip();

    try {
      const { data, error } = await supabase.rpc("place_bet", {
        p_stake: stake,
        p_request_id: crypto.randomUUID(),
        p_legs: state.selections.map(selection => ({
          event_id: selection.eventId,
          market_id: selection.marketId,
          outcome_id: selection.outcomeId
        }))
      });

      if (error) throw error;

      if (data?.balance != null) {
        state.profile.chips = Number(data.balance);
        $("#balanceValue").textContent = formatChips(data.balance);
      }

      balanceSyncChannel?.postMessage({ type: "balance-changed" });

      toast(
        `Schedina #${data.ticket_id} piazzata · quota x${fmtOdd(data.final_total_odd)} · vincita potenziale ${formatChips(data.potential_win)} fiche.`
      );

      state.selections = [];

      await Promise.all([
        loadProfileAndProgression(),
        loadEvents()
      ]);

      const levelUp = await CasinoLevelUp.check();

      if (levelUp?.balance != null) {
        state.profile.chips = Number(levelUp.balance);
        $("#balanceValue").textContent = formatChips(levelUp.balance);
      }

    } catch (error) {
      console.error("place_bet:", error);
      toast(readableRpcError(error), true);
    } finally {
      state.busy = false;
      renderBetslip();
    }
  }

  document.addEventListener("click", event => {
    const modeButton = event.target.closest("[data-bet-mode]");
    if (modeButton) {
      const nextMode = modeButton.dataset.betMode;

      if (nextMode === "multiple" && state.betMode === "system") {
        const hasAlternatives = groupSelectionsByEvent().some(group => group.length > 1);

        if (hasAlternatives) {
          toast("Rimuovi le selezioni alternative prima di tornare alla Multipla.", true);
          return;
        }
      }

      state.betMode = nextMode === "system" ? "system" : "multiple";
      renderEvents();
      renderBetslip();
      return;
    }

    const oddButtonEl = event.target.closest("[data-add-selection]");
    if (oddButtonEl) {
      addSelectionFromButton(oddButtonEl);
      return;
    }

    const dayToggle = event.target.closest("[data-toggle-day]");
    if (dayToggle) {
      const day = dayToggle.dataset.toggleDay;
      if (state.openDays.has(day)) state.openDays.delete(day);
      else state.openDays.add(day);
      renderEvents();
      return;
    }

    const mobileSlipJump = event.target.closest("[data-mobile-slip-jump]");
    if (mobileSlipJump) {
      document.querySelector(".betslip")?.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
      return;
    }

    const toggle = event.target.closest("[data-toggle-event]");
    if (toggle) {
      const card = document.querySelector(`[data-event-card="${toggle.dataset.toggleEvent}"]`);
      if (card) {
        const expanded = card.classList.toggle("expanded");
        toggle.textContent = expanded ? "−" : "+";
      }
      return;
    }

    const remove = event.target.closest("[data-remove-selection]");
    if (remove) {
      const eventId = Number(remove.dataset.eventId);
      const marketId = String(remove.dataset.marketId);
      const outcomeId = String(remove.dataset.outcomeId);

      state.selections = state.selections.filter(selection =>
        !(
          Number(selection.eventId) === eventId
          && String(selection.marketId) === marketId
          && String(selection.outcomeId) === outcomeId
        )
      );

      renderEvents();
      renderBetslip();
      return;
    }

    const leagueFilter = event.target.closest("[data-league-filter]");
    if (leagueFilter) {
      state.leagueFilter = leagueFilter.dataset.leagueFilter;
      document.querySelectorAll("[data-league-filter]").forEach(button => {
        button.classList.toggle("active", button === leagueFilter);
      });
      renderEvents();
      return;
    }

    const dateFilter = event.target.closest("[data-date-filter]");
    if (dateFilter) {
      state.dateFilter = dateFilter.dataset.dateFilter;

      if (state.dateFilter === "today") state.openDays.add(todayRomeKey(0));
      if (state.dateFilter === "tomorrow") state.openDays.add(todayRomeKey(1));

      document.querySelectorAll("[data-date-filter]").forEach(button => {
        button.classList.toggle("active", button === dateFilter);
      });
      renderEvents();
      return;
    }

    if (event.target.closest("#placeBetBtn")) {
      placeBet();
    }
  });

  document.addEventListener("input", event => {
    if (event.target.id === "teamSearch") {
      state.search = event.target.value;
      renderEvents();
      return;
    }

    if (event.target.id === "stakeInput") {
      updatePotentialOnly();
    }
  });

  $("#clearFiltersBtn").addEventListener("click", () => {
    state.dateFilter = "all";
    state.leagueFilter = "all";
    state.search = "";
    $("#teamSearch").value = "";

    document.querySelectorAll("[data-date-filter]").forEach(button => {
      button.classList.toggle("active", button.dataset.dateFilter === "all");
    });

    document.querySelectorAll("[data-league-filter]").forEach(button => {
      button.classList.toggle("active", button.dataset.leagueFilter === "all");
    });

    renderEvents();
  });

  $("#myBetsBtn").addEventListener("click", () => {
    location.href = "./my-bets.html";
  });

  $("#refreshBtn").addEventListener("click", refreshAll);

  balanceSyncChannel?.addEventListener("message", event => {
    if (event.data?.type === "balance-changed") {
      loadProfileAndProgression().catch(console.error);
    }
  });

  async function boot() {
    try {
      const { data, error } = await supabase.auth.getSession();
      if (error) throw error;

      if (!data.session) {
        location.href = "../index.html";
        return;
      }

      state.session = data.session;

      await loadLevels();
      await Promise.all([
        loadProfileAndProgression(),
        loadEvents()
      ]);

      renderBetslip();
      initMobileBetslipObserver();
      $("#loadingOverlay").classList.add("hidden");

    } catch (error) {
      console.error("sportsbook boot:", error);
      $("#loadingText").textContent = "Errore";
      $("#loadingError").textContent = error?.message || String(error);
    }
  }

  boot();
</script>

</body>
</html>
